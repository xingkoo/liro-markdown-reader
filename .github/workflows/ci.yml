name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-14
          - platform: windows-2022
    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build
