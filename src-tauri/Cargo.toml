[package]
name = "liro_markdown_reader"
version = "0.1.7"
description = "Liro markdown reader"
authors = ["xing"]
license = ""
repository = ""
default-run = "liro_markdown_reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1.6", features = ["dialog-all"] }
rfd = "0.15"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
